<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Core-Banking Fun Space</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0a2540;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .container {
            text-align: center;
            padding: 2rem;
            max-width: 800px;
        }
        
        .paragraph {
            margin: 2rem 0;
            padding: 0;
            animation: fadeIn 1s ease-out;
        }
        
        .paragraph:first-child {
            font-size: 2.5rem;
            font-weight: bold;
            color: white;
        }
        
        .paragraph:last-child {
            font-size: 1.8rem;
            font-style: italic;
            color: #ffd700;
        }
        
        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="paragraph">
            Welcome to Core-Banking Fun space! :)
        </div>
        <div class="paragraph">
            come back later for some interesting challenge...
        </div>
    </div>
